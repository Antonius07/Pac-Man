<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pac-Man</title>

    <style>
        #gameCanvas{
            box-shadow: 10px 10px 20px black;  
        }
        h1{
            text-align: center;
            font-family: comic sans MS;
            color: lightgrey;
        }
        body{
            display: flex;
            justify-content: center;
            overflow: hidden;
            height: 100vh;
            background: linear-gradient(
                0deg,
                rgb(1, 41, 173)0%,
                rgb(49, 3, 75)100%
            );
        }
    </style>
  </head>

  <body>
    <div>
      <h1>Pac-Man</h1>
      <canvas id="gameCanvas"></canvas>
    </div>

    <script src="src/Game.js" type="module"></script>
    <!-- type module moet erbij want we zullen  import en export gebruiken -->
  </body>
</html>
